:root{ color-scheme: light;
  --bg:#f6f7f9; --card:#ffffff; --ink:#16191d; --muted:#6b7280; --line:#e6e8eb;
  --accent:#e8512b; --accent2:#2b6be8; --green:#1f9d55; --warn:#c0392b;
  --ring:#e8512b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.45;padding:14px;max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.weekbar{display:flex;gap:6px;margin-bottom:10px}
.weekbar button{flex:1;padding:9px 4px;border:1px solid var(--line);background:var(--card);
  border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.weekbar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tabbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabbar button{padding:7px 10px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.tabbar button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.ring{width:62px;height:62px;flex:0 0 auto}
.head .ht{font-weight:700;font-size:16px}
.head .hs{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.block-h{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;
  color:var(--accent);margin:2px 0 8px}
.ex{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:none}
.cb{flex:0 0 auto;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;
  margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#fff;transition:.12s;background:var(--card)}
.cb.on{background:var(--green);border-color:var(--green)}
.ex .nm{font-weight:600}
.ex.done .nm{text-decoration:line-through;color:var(--muted)}
.ex .dt{color:var(--muted);font-size:12.5px}
.sets{flex:0 0 auto;font-weight:700;font-size:12.5px;color:var(--accent2);
  background:#eef3fe;border-radius:8px;padding:2px 8px;margin-left:auto;white-space:nowrap}
.flag-note{background:#fdecea;color:var(--warn);border-radius:8px;padding:8px 10px;
  font-size:12.5px;font-weight:600;margin-top:8px}
.muted-note{color:var(--muted);font-size:12.5px;margin-top:6px}
.reset{margin-top:6px;background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
.rule{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.rule:first-child{border-top:none}
.rule b{color:var(--accent)}
.goal{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:none}
.goal .g1{font-weight:600}.goal .g2{color:var(--muted);text-align:right}
.notes label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
.notes input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
.yoga{background:#eef6f0;border:1px solid #cfe6d6;border-radius:12px;padding:12px 14px;color:#1f6b3e;font-size:13.5px}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:8px}
</style>
</head>

function ck(key){return localStorage.getItem("flag6c_"+key)==="1"}
function setck(key,v){v?localStorage.setItem("flag6c_"+key,"1"):localStorage.removeItem("flag6c_"+key)}

function exRow(key,ex){
 const on=ck(key);
 return `<div class="ex ${on?'done':''}" data-k="${key}">
   <div class="cb ${on?'on':''}" data-k="${key}">${on?'✓':''}</div>
   <div><div class="nm">${ex.nm}</div>${ex.dt?`<div class="dt">${ex.dt}</div>`:''}</div>
   <div class="sets">${ex.s}</div></div>`;
}

  .map(w=>`<button class="${w===week?'on':''}" data-w="${w}">${w.replace("-","–")}</button>`).join("");
}
function renderTabbar(){
 document.getElementById("tabbar").innerHTML=TABS
  .map(t=>`<button class="${t.id===tab?'on':''}" data-t="${t.id}">${t.label}</button>`).join("");
}

function collectKeys(){
 let keys=[];
 if(tab==="warm") WARMUP.forEach((e,i)=>keys.push("warm_"+i));
 else if(tab==="kick") KICK.forEach((e,i)=>keys.push("kick_"+i));
 else if(tab==="mob") MOBILITY.forEach((e,i)=>keys.push("mob_"+i));
 else if(tab==="nogi") NOGI.forEach((e,i)=>keys.push("nogi_"+i));
 else if(["D1","D3","D5"].includes(tab)){
   const d=PLAN[week][tab];
   d.blocks.forEach((b,bi)=>b.items.forEach((e,ii)=>keys.push(week+"_"+tab+"_"+bi+"_"+ii)));
 }
 return keys;
}

   const d5note = tab==="D5" ? `<div class="muted-note">🩹 Lędźwie: dragon flag i negatywy front lever na zmianę co tydzień (nie razem). Plecy zmęczone → utnij 45° o serię.</div>` : "";
   html+=`<div class="card" style="text-align:center">
     <div class="muted-note">⚠️ Przed flagą: rozgrzewka + kick drill. ${mobTxt}</div>
     ${d5note}
     <button class="reset" data-reset="day">🔄 Resetuj ${tab}</button></div>`;
 }
 else if(tab==="nogi"){
   ht.textContent="Nogi i moc"; hs.textContent="1× w tygodniu · dzień nieflagowy";
   html+=`<div class="card"><div class="block-h">Nogi i moc</div>${NOGI.map((e,i)=>exRow("nogi_"+i,e)).join("")}
     <div class="muted-note">🗓️ Osobny dzień — nie sąsiadująco z sesją flagową (najlepiej dzień jogi lub OFF). Na koniec krótki cooldown: możesz powtórzyć blok mobilności L-sit.</div>
     <div class="muted-note">🚴 Wiosna: trasa rowerem ~50 km jako wytrzymałość — zamiennie w weekend.</div>
     <button class="reset" data-reset="nogi">🔄 Resetuj nogi</button></div>`;
 }
 else if(tab==="rules"){
   ht.textContent="Zasady bezwzględne"; hs.textContent="Nienaruszalne";
   html+=`<div class="card">${RULES.map(r=>`<div class="rule"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("")}</div>`;
   html+=`<div class="yoga"><b>🧘 Struktura tygodnia:</b> D1 Flaga+Pull · D2 Joga · D3 Flaga+Push · D4 Joga · D5 Flaga+Core · D6 Joga · D7 OFF<br>🦵 Nogi: osobny dzień, nie przed sesją flagową. Mobilność L-sit zostaje na końcu D3 i D5.</div>`;
 }
 else if(tab==="goals"){
   ht.textContent="Cele"; hs.textContent="Tygodniowe i końcowe";
   html+=`<div class="card"><div class="block-h">Cele tygodniowe</div>${GOALS_WK.map(g=>`<div class="goal"><span class="g1">${g[0]}</span><span class="g2">${g[1]}</span></div>`).join("")}</div>`;
   html+=`<div class="card"><div class="block-h">Cele po 6 tygodniach</div>${GOALS_END.map(g=>`<div class="goal"><span class="g1">${g[0]}</span><span class="g2">${g[1]}</span></div>`).join("")}</div>`;
 }
 else if(tab==="notes"){
   ht.textContent="Notatki po D5"; hs.textContent="Zapisuj po każdym teście";
   const flds=[["h45","Czas holdu 45° (s)"],["h40","Czas holdu 40° (s)"],["kick","Jakość kicka 1–10"],["bark","Bark 1–10"],["led","Lędźwie 1–10"]];
   html+=`<div class="card notes"><div class="block-h">${week} · log D5</div>`+
     flds.map(f=>`<label>${f[1]}</label><input data-note="${week}_${f[0]}" value="${(localStorage.getItem("flag6n_"+week+"_"+f[0])||"")}" inputmode="numeric">`).join("")+
     `<div class="muted-note">Zapisuje się automatycznie. Osobny log dla każdego bloku tygodni.</div></div>`;
 }
 c.innerHTML=html;
 updateRing();
}

function updateRing(){
 const keys=collectKeys();
 const ringEl=document.getElementById("ringfill"), txt=document.getElementById("ringtxt");
 if(!keys.length){ ringEl.setAttribute("stroke-dasharray","0 100"); txt.textContent="—"; return;}
 const done=keys.filter(ck).length;
 const pct=Math.round(done/keys.length*100);
 ringEl.setAttribute("stroke-dasharray",pct+" "+(100-pct));
 txt.textContent=pct+"%";
}

document.getElementById("weekbar").addEventListener("click",e=>{
 const w=e.target.dataset.w; if(!w)return; week=w; localStorage.setItem("flag6_week",w);
 renderWeekbar(); renderContent();
});
document.getElementById("tabbar").addEventListener("click",e=>{
 const t=e.target.dataset.t; if(!t)return; tab=t; localStorage.setItem("flag6_tab",t);
 renderTabbar(); renderContent();
});
document.getElementById("content").addEventListener("click",e=>{
 const row=e.target.closest("[data-k]");
 if(row){ const k=row.dataset.k; setck(k,!ck(k)); renderContent(); return;}
 const rb=e.target.closest("[data-reset]");
 if(rb){ collectKeys().forEach(k=>setck(k,false)); renderContent(); }
});
document.getElementById("content").addEventListener("input",e=>{
 const n=e.target.dataset.note; if(n) localStorage.setItem("flag6n_"+n,e.target.value);
});

renderWeekbar(); renderTabbar(); renderContent();
</script>
</body>
</html>
